syntax = "proto3";

package de.employee.v1;

option go_package = "github.com/digital-employee-platform/backend/gen/de/employee/v1;employeev1";

service EmployeeService {
  rpc ResolveActive(ResolveActiveRequest) returns (ResolveActiveResponse);
}

message ResolveActiveRequest {
  string workspace_id = 1;
  string digital_employee_id = 2;
}

message ResolveActiveResponse {
  string id = 1;
  string name = 2;
  string lifecycle = 3;
  bool active = 4;
  string reason = 5;
}
