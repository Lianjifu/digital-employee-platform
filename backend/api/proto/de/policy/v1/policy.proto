syntax = "proto3";

package de.policy.v1;

import "de/common/v1/common.proto";

option go_package = "github.com/digital-employee-platform/backend/gen/de/policy/v1;policyv1";

service PolicyService {
  rpc GetAccessGovernance(GetAccessGovernanceRequest) returns (AccessGovernance);
  rpc EvaluateZeroTrust(EvaluateZeroTrustRequest) returns (ZeroTrustEvaluation);
}

message GetAccessGovernanceRequest {}

message AccessGovernance {
  repeated AccessGrant grants = 1;
  string generated_at = 2;
}

message AccessGrant {
  string id = 1;
  string subject_id = 2;
  string subject_name = 3;
  string role = 4;
  repeated string workspace_ids = 5;
  string status = 6;
}

message EvaluateZeroTrustRequest {
  string resource = 1;
  string action = 2;
  string classification = 3;
  bool external = 4;
  string correlation_id = 5;
}

message ZeroTrustEvaluation {
  // decision 保留线格式字符串（allow|mask|approval_required|deny），避免 FILE breaking。
  string decision = 1;
  string reason = 2;
  string policy_id = 3;
  string correlation_id = 4;
  de.common.v1.PolicyDecision decision_enum = 5;
}
