# Best-effort Authentik blueprint for local de-core OIDC.
# If apply fails on your Authentik version, create the provider in the UI
# (see deploy/authentik/README.md).
version: 1
metadata:
  name: de-core-oidc
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: de-core-provider
    state: present
    identifiers:
      name: Provider for de-core
    attrs:
      name: Provider for de-core
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      client_type: confidential
      client_id: de-core
      client_secret: de-core-secret
      access_code_validity: minutes=1
      access_token_validity: minutes=10
      refresh_token_validity: days=30
      include_claims_in_id_token: true
      redirect_uris: http://127.0.0.1:8080/api/auth/oidc/callback
      sub_mode: hashed_user_id
      issuer_mode: per_provider
  - model: authentik_core.application
    state: present
    identifiers:
      slug: de
    attrs:
      name: de-core
      slug: de
      provider: !KeyOf de-core-provider
      policy_engine_mode: any
