# Monolith gateway: all traffic → de-app:8100 (方案 A)
static_resources:
  listeners:
    - name: listener_http_monolith
      address:
        socket_address: { address: 0.0.0.0, port_value: 8089 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: de_monolith_ingress
                codec_type: AUTO
                route_config:
                  name: monolith_route
                  virtual_hosts:
                    - name: backend
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/api/copilot" }
                          route: { cluster: de_app, timeout: 180s }
                        - match: { prefix: "/api/conversations" }
                          route: { cluster: de_app, timeout: 180s }
                        - match: { prefix: "/api/model-invoke" }
                          route: { cluster: de_app, timeout: 120s }
                        - match: { prefix: "/" }
                          route: { cluster: de_app, timeout: 180s }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: de_app
      connect_timeout: 2s
      type: LOGICAL_DNS
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: de_app
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: de-app, port_value: 8100 }

admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }
