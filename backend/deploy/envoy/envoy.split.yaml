# Path-based split skeleton: named clusters for future microservices.
# Today all clusters point at de-core :8080; swap addresses when services split out.
# Compose: make compose-up-split → http://127.0.0.1:8089
static_resources:
  listeners:
    - name: listener_http_split
      address:
        socket_address: { address: 0.0.0.0, port_value: 8089 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: de_split_ingress
                codec_type: AUTO
                route_config:
                  name: split_route
                  virtual_hosts:
                    - name: backend
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/agent" }
                          route:
                            cluster: de_collab
                            timeout: 60s
                            prefix_rewrite: "/api/copilot"
                        - match: { prefix: "/api/copilot" }
                          route: { cluster: de_collab, timeout: 60s }
                        - match: { prefix: "/api/conversations" }
                          route: { cluster: de_collab, timeout: 60s }
                        - match: { prefix: "/api/sessions" }
                          route: { cluster: de_collab, timeout: 30s }
                        - match: { prefix: "/api/access" }
                          route: { cluster: de_policy, timeout: 15s }
                        - match: { prefix: "/api/zero-trust" }
                          route: { cluster: de_policy, timeout: 15s }
                        - match: { prefix: "/api/governance" }
                          route: { cluster: de_policy, timeout: 15s }
                        - match: { prefix: "/api/audit" }
                          route: { cluster: de_audit, timeout: 30s }
                        - match: { prefix: "/api/audit-center" }
                          route: { cluster: de_audit, timeout: 30s }
                        - match: { prefix: "/api/digital-employees" }
                          route: { cluster: de_employee, timeout: 30s }
                        - match: { prefix: "/api/workspaces" }
                          route: { cluster: de_platform, timeout: 30s }
                        - match: { prefix: "/api/home" }
                          route: { cluster: de_platform, timeout: 30s }
                        - match: { prefix: "/api/operations" }
                          route: { cluster: de_platform, timeout: 30s }
                        - match: { prefix: "/connect" }
                          route: { cluster: de_core, timeout: 60s }
                        - match: { prefix: "/de." }
                          route: { cluster: de_core, timeout: 60s }
                        - match: { prefix: "/api" }
                          route: { cluster: de_core, timeout: 30s }
                        - match: { prefix: "/healthz" }
                          route: { cluster: de_core }
                        - match: { prefix: "/readyz" }
                          route: { cluster: de_core }
                        - match: { prefix: "/metrics" }
                          route: { cluster: de_core }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: de_core
      connect_timeout: 2s
      type: LOGICAL_DNS
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: de_core
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: host.docker.internal, port_value: 8080 }
    - name: de_platform
      connect_timeout: 2s
      type: LOGICAL_DNS
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: de_platform
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: host.docker.internal, port_value: 8080 }
    - name: de_policy
      connect_timeout: 2s
      type: LOGICAL_DNS
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: de_policy
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    # Independent de-policy process (make policy / compose profile policy)
                    socket_address: { address: host.docker.internal, port_value: 8094 }
    - name: de_audit
      connect_timeout: 2s
      type: LOGICAL_DNS
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: de_audit
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    # Independent de-audit process (make audit / compose profile audit)
                    socket_address: { address: host.docker.internal, port_value: 8095 }
    - name: de_collab
      connect_timeout: 2s
      type: LOGICAL_DNS
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: de_collab
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: host.docker.internal, port_value: 8080 }
    - name: de_employee
      connect_timeout: 2s
      type: LOGICAL_DNS
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: de_employee
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: host.docker.internal, port_value: 8080 }

admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }
