global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: de-monolith
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8100"]
        labels: { service: de-app }
  - job_name: de-coarse
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8100"]
        labels: { service: de-sys }
      - targets: ["host.docker.internal:8101"]
        labels: { service: de-collab }
      - targets: ["host.docker.internal:8102"]
        labels: { service: de-cap }
      - targets: ["host.docker.internal:8103"]
        labels: { service: de-workflow }
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
