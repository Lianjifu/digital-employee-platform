global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: de-core
    metrics_path: /metrics
    static_configs:
      # Host-run de-core (make run) or published apps port
      - targets: ["host.docker.internal:8080"]
        labels:
          service: de-core
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
