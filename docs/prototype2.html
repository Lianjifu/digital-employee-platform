<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>智能体平台管理后台 · 页面原型</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --rail-bg:#14161a;
  --rail-hover:#1e2127;
  --rail-active:#262a32;
  --accent:#6e6afb;
  --accent-dim:#ecebff;
  --accent-text:#4a45d6;
  --page-bg:#f3f3ef;
  --panel-bg:#ffffff;
  --border:#e5e4dd;
  --border-strong:#d5d3c9;
  --text-primary:#1b1c1f;
  --text-secondary:#68675f;
  --text-muted:#9c9b91;
  --mono:'IBM Plex Mono',monospace;
  --sans:'Inter',-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--sans);background:var(--page-bg);color:var(--text-primary);}
.app{display:grid;grid-template-columns:72px 264px 1fr;grid-template-rows:52px 1fr;height:100vh;min-height:720px;}

/* topbar */
.topbar{grid-column:1/4;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:var(--rail-bg);border-bottom:1px solid #23252b;}
.brand{display:flex;align-items:center;gap:9px;color:#fff;font-weight:600;font-size:13.5px;flex-shrink:0;}
.brand .mark{width:24px;height:24px;border-radius:6px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;}
.brand .env{font-size:10px;color:#8f8fa0;background:#20222a;padding:2px 7px;border-radius:5px;font-family:var(--mono);margin-left:2px;}
.topbar-search{flex:1;max-width:420px;margin:0 24px;position:relative;}
.topbar-search i{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:#75757f;font-size:14px;}
.topbar-search input{width:100%;height:30px;background:#1e2027;border:1px solid #2b2d35;border-radius:7px;padding:0 10px 0 32px;font-size:12.5px;color:#e4e4ea;outline:none;}
.topbar-search input::placeholder{color:#6f6f79;}
.topbar-right{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.icon-btn-dark{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#b8b8c2;cursor:pointer;position:relative;}
.icon-btn-dark:hover{background:#1e2127;}
.icon-btn-dark i{font-size:16px;}
.dot{position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%;background:#ef7b6a;}
.ws-switch{display:flex;align-items:center;gap:6px;color:#d2d2d9;font-size:12.5px;background:#1e2127;padding:5px 10px 5px 8px;border-radius:7px;cursor:pointer;margin-left:4px;}
.ws-switch i:first-child{font-size:14px;}
.ws-switch i:last-child{font-size:13px;color:#8f8fa0;}
.avatar{width:26px;height:26px;border-radius:50%;background:#3a3d46;display:flex;align-items:center;justify-content:center;color:#e6e6ea;font-size:11px;font-weight:500;margin-left:4px;cursor:pointer;}

/* rail */
.rail{background:var(--rail-bg);overflow-y:auto;padding:10px 0 16px;}
.rail-group-label{font-size:9px;color:#5c5c66;text-align:center;letter-spacing:.5px;margin:12px 0 4px;font-family:var(--mono);}
.rail-group:first-child .rail-group-label{margin-top:2px;}
.rail-item{width:56px;height:50px;margin:0 8px 2px;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#94949e;cursor:pointer;position:relative;}
.rail-item i{font-size:18px;}
.rail-item span{font-size:9.5px;line-height:1;}
.rail-item:hover{background:var(--rail-hover);color:#e2e2e8;}
.rail-item.active{background:var(--rail-active);color:#fff;}
.rail-item.active::before{content:"";position:absolute;left:-8px;top:12px;bottom:12px;width:3px;border-radius:2px;background:var(--accent);}

/* secondary panel */
.panel{background:var(--panel-bg);border-right:1px solid var(--border);overflow-y:auto;display:flex;flex-direction:column;}
.panel-head{padding:18px 18px 14px;border-bottom:1px solid var(--border);}
.panel-eyebrow{font-size:10.5px;color:var(--text-muted);font-family:var(--mono);letter-spacing:.3px;margin-bottom:5px;}
.panel-title{font-size:16px;font-weight:600;margin-bottom:7px;}
.panel-desc{font-size:12px;color:var(--text-secondary);line-height:1.6;}
.panel-search{margin:12px 16px 4px;position:relative;}
.panel-search i{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--text-muted);}
.panel-search input{width:100%;height:30px;border:1px solid var(--border);border-radius:7px;padding:0 8px 0 30px;font-size:12.5px;outline:none;}
.panel-search input:focus{border-color:var(--border-strong);}
.panel-list{padding:8px 10px 16px;flex:1;}
.panel-item{padding:10px 11px;border-radius:8px;cursor:pointer;margin-bottom:1px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.panel-item:hover{background:#f7f7f4;}
.panel-item.active{background:var(--accent-dim);}
.panel-item.active .panel-item-name{color:var(--accent-text);font-weight:500;}
.panel-item-name{font-size:13px;color:var(--text-primary);}
.panel-item-hint{font-size:10.5px;color:var(--text-muted);margin-top:2px;}
.panel-item-count{font-size:10.5px;color:var(--text-muted);background:#f1f0eb;padding:1px 7px;border-radius:20px;flex-shrink:0;}
.panel-item.active .panel-item-count{background:#dcdaff;color:var(--accent-text);}

/* main */
.main{overflow-y:auto;padding:22px 32px 60px;}
.crumb{font-size:12px;color:var(--text-muted);margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.crumb i{font-size:12px;}
.page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.page-title{font-size:20px;font-weight:600;}
.head-actions{display:flex;gap:8px;}
.btn-primary{height:32px;padding:0 14px;background:var(--text-primary);color:#fff;border:none;border-radius:8px;font-size:12.5px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:5px;}
.btn-primary i{font-size:14px;}
.btn-icon{width:32px;height:32px;border:1px solid var(--border);border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--text-secondary);cursor:pointer;font-size:14px;}
.info-toggle{font-size:11.5px;color:var(--text-muted);display:flex;align-items:center;gap:4px;cursor:pointer;margin-bottom:16px;width:fit-content;}
.info-toggle i{font-size:13px;}
.info-toggle:hover{color:var(--text-secondary);}
.info-drawer{display:none;background:#faf9f6;border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:18px;font-size:12.5px;color:var(--text-secondary);line-height:1.7;}
.info-drawer.open{display:block;}
.info-drawer b{color:var(--text-primary);font-weight:500;}

/* status badges */
.status{font-size:11px;padding:3px 9px;border-radius:20px;font-weight:500;white-space:nowrap;display:inline-block;}
.status-success{background:#e6f4e8;color:#1c7a37;}
.status-warning{background:#fbf1e0;color:#9a6114;}
.status-danger{background:#faeaea;color:#b13a3a;}
.status-muted{background:#f0efea;color:#7a7970;}
.status-accent{background:var(--accent-dim);color:var(--accent-text);}

/* toolbar */
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.search-box{flex:1;max-width:280px;position:relative;}
.search-box i{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--text-muted);}
.search-box input{width:100%;height:32px;border:1px solid var(--border);border-radius:8px;padding:0 10px 0 30px;font-size:12.5px;outline:none;background:#fff;}
.filter-chip{height:32px;padding:0 12px;border:1px solid var(--border);border-radius:8px;background:#fff;font-size:12px;color:var(--text-secondary);display:flex;align-items:center;gap:5px;cursor:pointer;}

/* table */
.dtable-wrap{background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.dtable{width:100%;border-collapse:collapse;}
.dtable th{text-align:left;font-size:10.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.3px;padding:10px 16px;background:#faf9f6;border-bottom:1px solid var(--border);font-weight:500;}
.dtable td{padding:11px 16px;font-size:12.5px;border-bottom:1px solid #f1f0ea;color:var(--text-primary);}
.dtable tr:last-child td{border-bottom:none;}
.dtable tbody tr:hover td{background:#faf9f6;}
.cell-sub{font-size:11px;color:var(--text-muted);margin-top:2px;}
.table-foot{display:flex;justify-content:space-between;align-items:center;padding:11px 4px 0;font-size:11.5px;color:var(--text-muted);}
.pager{display:flex;gap:4px;}
.pager span{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);cursor:pointer;}
.pager span.on{background:var(--text-primary);color:#fff;border-color:var(--text-primary);}

/* grid cards */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;}
.gcard{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px;cursor:pointer;}
.gcard:hover{border-color:var(--border-strong);}
.gcard-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px;}
.gcard-icon{width:34px;height:34px;border-radius:9px;background:var(--accent-dim);color:var(--accent-text);display:flex;align-items:center;justify-content:center;font-size:16px;}
.gcard-title{font-size:13px;font-weight:500;margin-bottom:4px;}
.gcard-desc{font-size:11.5px;color:var(--text-secondary);line-height:1.55;margin-bottom:12px;min-height:34px;}
.gcard-meta{font-size:10.5px;color:var(--text-muted);display:flex;justify-content:space-between;padding-top:10px;border-top:1px solid #f1f0ea;}

/* form */
.form-section{background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px 20px;margin-bottom:12px;max-width:640px;}
.form-section-title{font-size:12.5px;font-weight:600;margin-bottom:14px;color:var(--text-primary);}
.form-row{margin-bottom:14px;}
.form-row:last-child{margin-bottom:0;}
.form-row label{display:block;font-size:11.5px;color:var(--text-secondary);margin-bottom:6px;}
.form-row input,.form-row select,.form-row textarea{width:100%;border:1px solid var(--border);border-radius:7px;padding:7px 10px;font-size:12.5px;font-family:var(--sans);color:var(--text-primary);background:#fff;outline:none;}
.form-row textarea{resize:vertical;min-height:56px;}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid #f1f0ea;}
.toggle-row:last-child{border-bottom:none;}
.toggle-row-label{font-size:12.5px;}
.toggle-row-hint{font-size:11px;color:var(--text-muted);margin-top:2px;}
.switch{width:34px;height:19px;border-radius:20px;background:var(--border-strong);position:relative;flex-shrink:0;}
.switch.on{background:var(--accent);}
.switch::after{content:"";position:absolute;width:15px;height:15px;border-radius:50%;background:#fff;top:2px;left:2px;}
.switch.on::after{left:17px;}
.form-actions{display:flex;gap:8px;margin-top:4px;max-width:640px;}
.btn-ghost{height:32px;padding:0 14px;border:1px solid var(--border);border-radius:8px;background:#fff;font-size:12.5px;color:var(--text-secondary);}

/* dashboard */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px;}
.stat-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:15px 17px;}
.stat-label{font-size:11.5px;color:var(--text-muted);margin-bottom:8px;}
.stat-value{font-size:22px;font-weight:600;margin-bottom:6px;}
.stat-delta{font-size:11px;}
.stat-delta.up{color:#1c7a37;}
.stat-delta.down{color:#b13a3a;}
.chart-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px 20px;margin-bottom:14px;}
.chart-title{font-size:12px;color:var(--text-muted);margin-bottom:16px;}
.bar-chart{display:flex;align-items:flex-end;gap:10px;height:120px;padding-bottom:22px;position:relative;}
.bar-col{flex:1;height:100%;display:flex;align-items:flex-end;position:relative;}
.bar-fill{width:100%;background:var(--accent-dim);border-radius:4px 4px 0 0;position:relative;}
.bar-fill i{position:absolute;bottom:100%;left:0;right:0;text-align:center;font-size:10px;color:var(--text-secondary);font-style:normal;margin-bottom:4px;display:block;}
.bar-label{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:10px;color:var(--text-muted);}

/* chat mock */
.chat-mock{background:#fff;border:1px solid var(--border);border-radius:12px;padding:20px;min-height:340px;display:flex;flex-direction:column;gap:12px;}
.bubble{max-width:66%;padding:9px 13px;border-radius:12px;font-size:12.5px;line-height:1.6;}
.bubble.agent{background:#f4f4f0;align-self:flex-start;border-bottom-left-radius:4px;}
.bubble.user{background:var(--text-primary);color:#fff;align-self:flex-end;border-bottom-right-radius:4px;}
.chat-input{margin-top:auto;display:flex;gap:8px;border:1px solid var(--border);border-radius:10px;padding:8px 12px;align-items:center;color:var(--text-muted);font-size:12.5px;}
.chat-input i{font-size:15px;}

/* flow mock */
.flow-mock{background:#fcfcf9;background-image:radial-gradient(#e3e2d9 1px,transparent 1px);background-size:16px 16px;border:1px solid var(--border);border-radius:12px;height:340px;position:relative;overflow:hidden;}
.flow-node{position:absolute;background:#fff;border:1px solid var(--border-strong);border-radius:9px;padding:9px 13px;font-size:11.5px;box-shadow:0 1px 2px rgba(0,0,0,.05);}
.flow-node b{display:block;font-size:12px;margin-bottom:2px;}
.flow-node span{color:var(--text-muted);font-size:10.5px;}
.flow-line{position:absolute;background:var(--border-strong);height:1.5px;}

/* log mock */
.log-mock{background:#191a1e;border-radius:12px;padding:15px 17px;font-family:var(--mono);font-size:11.5px;line-height:2;color:#c6c6cf;max-height:360px;overflow-y:auto;}
.log-time{color:#68686f;margin-right:8px;}
.log-info{color:#7cc2ff;}
.log-warn{color:#eeb75c;}
.log-err{color:#ef716c;}
.log-ok{color:#7fd39a;}

.sibling-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px;padding-top:16px;border-top:1px solid var(--border);}
.sibling-chip{font-size:11.5px;color:var(--text-secondary);border:1px solid var(--border);padding:5px 12px;border-radius:20px;cursor:pointer;}
.sibling-chip:hover{border-color:var(--border-strong);color:var(--text-primary);}
.sibling-chip.active{background:var(--text-primary);color:#fff;border-color:var(--text-primary);}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand"><div class="mark">A</div>智能体平台<span class="env">生产环境</span></div>
    <div class="topbar-search"><i class="ti ti-search"></i><input placeholder="搜索智能体、工作流、知识库、技能..."></div>
    <div class="topbar-right">
      <div class="icon-btn-dark"><i class="ti ti-question-mark"></i></div>
      <div class="icon-btn-dark"><i class="ti ti-bell"></i><span class="dot"></span></div>
      <div class="ws-switch"><i class="ti ti-building"></i>默认工作区<i class="ti ti-chevron-down"></i></div>
      <div class="avatar">PM</div>
    </div>
  </div>
  <div class="rail" id="rail"></div>
  <div class="panel" id="panel"></div>
  <div class="main" id="main"></div>
</div>

<script>
function b(s){
  const map={运行中:'success',已发布:'success',正常:'success',成功:'success',已连接:'success',启用:'success',通过:'success',已完成:'success',在线:'success',已授权:'success',
  待处理:'warning',排队中:'warning',草稿:'warning',待审核:'warning',降级:'warning',处理中:'warning',灰度中:'warning',待标注:'warning',
  失败:'danger',异常:'danger',已拦截:'danger',离线:'danger',已禁用:'danger',高风险:'danger',超时:'danger',已过期:'danger',
  已归档:'muted',已停用:'muted',未连接:'muted'};
  return `<span class="status status-${map[s]||'accent'}">${s}</span>`;
}
function tbl(cols,rows,primary){
  return `<div class="toolbar">
    <div class="search-box"><i class="ti ti-search"></i><input placeholder="搜索..."></div>
    <div class="filter-chip"><i class="ti ti-filter"></i>筛选</div>
    <div style="flex:1"></div>
    <button class="btn-primary"><i class="ti ti-plus"></i>${primary||'新建'}</button>
  </div>
  <div class="dtable-wrap"><table class="dtable"><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead>
  <tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
  <div class="table-foot"><span>共 ${rows.length*7} 条</span><div class="pager"><span><i class="ti ti-chevron-left" style="font-size:12px"></i></span><span class="on">1</span><span>2</span><span>3</span><span><i class="ti ti-chevron-right" style="font-size:12px"></i></span></div></div>`;
}
function grid(cards,primary){
  return `<div class="toolbar">
    <div class="search-box"><i class="ti ti-search"></i><input placeholder="搜索..."></div>
    <div style="flex:1"></div>
    <button class="btn-primary"><i class="ti ti-plus"></i>${primary||'新建'}</button>
  </div>
  <div class="card-grid">${cards.map(c=>`
    <div class="gcard">
      <div class="gcard-top"><div class="gcard-icon"><i class="ti ${c.icon}"></i></div>${c.badge?b(c.badge):''}</div>
      <div class="gcard-title">${c.title}</div>
      <div class="gcard-desc">${c.desc}</div>
      <div class="gcard-meta"><span>${c.meta1}</span><span>${c.meta2}</span></div>
    </div>`).join('')}</div>`;
}
function form(sections){
  return sections.map(s=>`
    <div class="form-section">
      <div class="form-section-title">${s.title}</div>
      ${s.fields.map(f=>{
        if(f.type==='toggle') return `<div class="toggle-row"><div><div class="toggle-row-label">${f.label}</div><div class="toggle-row-hint">${f.hint||''}</div></div><div class="switch ${f.on?'on':''}"></div></div>`;
        if(f.type==='select') return `<div class="form-row"><label>${f.label}</label><select>${(f.options||[]).map(o=>`<option>${o}</option>`).join('')}</select></div>`;
        if(f.type==='textarea') return `<div class="form-row"><label>${f.label}</label><textarea>${f.value||''}</textarea></div>`;
        return `<div class="form-row"><label>${f.label}</label><input value="${f.value||''}"></div>`;
      }).join('')}
    </div>`).join('') + `<div class="form-actions"><button class="btn-primary">保存</button><button class="btn-ghost">取消</button></div>`;
}
function dash(stats,chart){
  return `<div class="stat-grid">${stats.map(s=>`
    <div class="stat-card"><div class="stat-label">${s.label}</div><div class="stat-value">${s.value}</div><div class="stat-delta ${s.trend}">${s.delta}</div></div>`).join('')}</div>
  <div class="chart-card"><div class="chart-title">${chart.title}</div>
  <div class="bar-chart">${chart.bars.map(v=>`<div class="bar-col"><div class="bar-fill" style="height:${v.h}%"><i>${v.v}</i></div><div class="bar-label">${v.l}</div></div>`).join('')}</div></div>`;
}
function chat(){
  return `<div class="chat-mock">
    <div class="bubble user">帮我总结一下上季度的客户续约情况</div>
    <div class="bubble agent">好的，正在检索客户中心与合同知识库…上季度共 128 家客户到期，续约 103 家，续约率 80.5%，较上季度提升 3.2 个百分点。需要我按行业拆分明细吗？</div>
    <div class="bubble user">按行业拆一下，重点看流失原因</div>
    <div class="bubble agent">已生成分析报告，制造业流失率最高（18%），主要原因集中在"价格敏感"与"服务响应慢"两类反馈…</div>
    <div class="chat-input"><i class="ti ti-plus"></i><span>输入消息，或使用 / 调用工具…</span><i class="ti ti-send-2" style="margin-left:auto"></i></div>
  </div>`;
}
function flow(){
  return `<div class="flow-mock">
    <div class="flow-node" style="left:20px;top:140px;"><b>触发器</b><span>用户提交表单</span></div>
    <div class="flow-node" style="left:190px;top:60px;"><b>知识检索</b><span>RAG · 产品知识库</span></div>
    <div class="flow-node" style="left:190px;top:220px;"><b>条件判断</b><span>是否需要人工审核</span></div>
    <div class="flow-node" style="left:390px;top:60px;"><b>模型生成</b><span>Claude Sonnet 5</span></div>
    <div class="flow-node" style="left:390px;top:220px;"><b>转人工</b><span>分配至客服组</span></div>

let activeModule=0, activeItem=0;

function renderRail(){
  const rail=document.getElementById('rail');
  let html='', lastGroup=null;
  DATA.forEach((m,i)=>{
    if(m.group!==lastGroup){ html+=`<div class="rail-group"><div class="rail-group-label">${m.group}</div>`; lastGroup=m.group; }
    html+=`<div class="rail-item ${i===activeModule?'active':''}" title="${m.name}" onclick="selectModule(${i})"><i class="ti ${m.icon}"></i><span>${m.short}</span></div>`;
    const next=DATA[i+1];
    if(!next||next.group!==m.group) html+='</div>';
  });
  rail.innerHTML=html;
}
function renderPanel(){
  const m=DATA[activeModule];
  document.getElementById('panel').innerHTML=`
    <div class="panel-head">
      <div class="panel-eyebrow">一级菜单 · ${String(activeModule+1).padStart(2,'0')}</div>
      <div class="panel-title">${m.name}</div>
      <div class="panel-desc">${m.desc}</div>
    </div>
    <div class="panel-search"><i class="ti ti-search"></i><input placeholder="搜索${m.name}下的功能..."></div>
    <div class="panel-list">${m.items.map((it,i)=>`
      <div class="panel-item ${i===activeItem?'active':''}" onclick="selectItem(${i})">
        <div><div class="panel-item-name">${it.name}</div><div class="panel-item-hint">${it.hint}</div></div>
        <i class="ti ti-chevron-right" style="font-size:12px;color:var(--text-muted)"></i>
      </div>`).join('')}</div>`;
}
function renderMain(){
  const m=DATA[activeModule], it=m.items[activeItem];
  document.getElementById('main').innerHTML=`
    <div class="crumb"><i class="ti ${m.icon}"></i>${m.name}<i class="ti ti-chevron-right"></i>${it.name}</div>
    <div class="page-head">
      <div class="page-title">${it.name}</div>
      <div class="head-actions"><div class="btn-icon"><i class="ti ti-refresh"></i></div><div class="btn-icon"><i class="ti ti-dots"></i></div></div>
    </div>
    <div class="info-toggle" onclick="this.nextElementSibling.classList.toggle('open')"><i class="ti ti-info-circle"></i>查看模块说明（一级能力定位）</div>
    <div class="info-drawer"><b>定位：</b>${m.pos}。<br><b>说明：</b>${m.desc}</div>
    ${it.render()}
    <div class="sibling-row">${m.items.map((s,i)=>`<div class="sibling-chip ${i===activeItem?'active':''}" onclick="selectItem(${i})">${s.name}</div>`).join('')}</div>`;
}
function selectModule(i){activeModule=i;activeItem=0;renderAll();}
function selectItem(i){activeItem=i;renderPanel();renderMain();}
function renderAll(){renderRail();renderPanel();renderMain();}
renderAll();
</script>
